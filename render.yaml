# Déploiement Render 100 % gratuit : site sur une instance Free, base PostgreSQL hébergée chez Neon (plan gratuit permanent).
services:
  - type: web
    name: autodeal
    runtime: docker
    plan: free            # se met en veille après 15 min sans visite ; "starter" pour l'éviter (payant)
    region: frankfurt
    healthCheckPath: /sante
    autoDeploy: true
    envVars:
      - key: AUTODEAL_ENV
        value: production
      - key: HTTPS_ONLY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: SETUP_TOKEN
        sync: false       # phrase secrète, sert une seule fois à créer le compte admin
      - key: DATABASE_URL
        sync: false       # coller la « connection string » de Neon (postgresql://…neon.tech/…?sslmode=require)
