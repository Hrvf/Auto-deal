{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block public %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-mark">AD</span><div><strong>AutoDeal Comparator</strong><small>Espace privé</small></div></div>
    {% include "partials/flashes.html" %}
    <form method="post" action="/connexion" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="suite" value="{{ next or '/' }}">
      <label>Adresse e-mail<input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></label>
      <label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
