services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # exposé seulement en local : placer un proxy HTTPS devant
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: autodeal
      POSTGRES_USER: autodeal
      POSTGRES_PASSWORD: motdepasse   # à changer, et à reporter dans DATABASE_URL
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  pgdata:
